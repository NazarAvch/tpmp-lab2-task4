name: C Build - Task 4 (Person)

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install build essentials
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make
    
    - name: Create data directory and sample input file
      run: |
        mkdir -p data
        cat > data/input.txt << 'EOF'
        Иванов Иван Иванович Мужской Русский 180 75 1990 05 15 +375291234567 220000 Беларусь Минская Минский Минск Ленина 10 25
        Петрова Анна Сергеевна Женский Белоруска 165 60 1995 08 22 +375297654321 220001 Беларусь Минская Минский Минск Пушкина 5 12
        Сидоров Алексей Петрович Мужской Русский 175 70 2000 12 10 +375331112233 220002 Беларусь Минская Минский Минск Горького 15 7
        Козлова Елена Владимировна Женский Русский 168 55 1988 03 01 +375295554444 220003 Беларусь Минская Минский Минск Сурганова 20 30
        Соколов Дмитрий Николаевич Мужской Белорус 185 80 2005 07 19 +375447776655 220004 Беларусь Минская Минский Минск Калиновского 8 45
        EOF
        echo "✅ Sample input.txt created"
        cat data/input.txt
    
    - name: Build project with Make
      run: make
    
    - name: Verify build artifact
      run: |
        if [ -f ./lab3_task4 ]; then
          echo "✅ Build successful! Executable 'lab3_task4' found."
          ls -la ./lab3_task4
        else
          echo "❌ Build failed! Executable not found."
          exit 1
        fi
    
    - name: Run program with sample data (optional)
      run: |
        echo "Running program with sample data..."
        echo "" | ./lab3_task4 || true
        echo "Program execution completed (may have issues due to stdin, but build is OK)"
    
    - name: Check if output file was created
      run: |
        if [ -f ./output.txt ]; then
          echo "✅ output.txt created successfully"
          cat ./output.txt
        else
          echo "⚠️ output.txt not created (program may require interactive input)"
        fi
